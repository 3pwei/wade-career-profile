  - id: ensense-cloud-engineer
    employer: EnSense
    position: { zh-TW: 雲端工程師, en: Cloud Engineer }
    employment_type: employee
    start_date: 2022-06
    end_date: 2024-01
    technologies: [Python, Node.js, Django REST Framework, MongoDB, AWS EC2, AWS S3, MQTT, Nginx, Git, Shell]
    verification_status: user_provided
    bullets:
      - id: ensense-forwarder-refactoring
        kind: achievement
        text:
          zh-TW: 主導 Node.js 資料轉送程式模組化，親自設計共用核心、JSON 設定與 Shell 產生工具，同事協作部分模組；各專案維持獨立程序，減少重複程式並分批導入既有服務。
          en: Led modular refactoring of Node.js data forwarders, personally designing the shared core, JSON configuration and Shell generator while teammates contributed modules; retained separate project processes and rolled out the design incrementally to reduce duplicated code.
        relevance_tags: [backend-engineer, cloud-platform-engineer]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22
      - id: ensense-django-api
        kind: responsibility
        text:
          zh-TW: 參與 Python／Django REST Framework 歷史資料查詢與 CSV／Excel 匯出 API 開發，依設備及時間區間查詢 MongoDB，處理時區、欄位格式與錯誤回應；以 Postman 驗證權限及匯出結果。
          en: Contributed historical-query and CSV/Excel export APIs in Python and Django REST Framework, querying MongoDB by device and time range, handling time zones, field formatting and errors, and checking permissions and exported results with Postman.
        relevance_tags: [backend-engineer]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22
      - id: ensense-time-boundary-fix
        kind: achievement
        text:
          zh-TW: 重現並定位整點資料重複轉送的時間區間邊界問題，改為含起點、不含終點的查詢，測試相鄰區間的筆數與時間戳後上線修正。
          en: Reproduced and isolated duplicate forwarding at hourly boundaries, changed queries to include the start and exclude the end, and checked adjacent-window record counts and timestamps before deploying the fix.
        relevance_tags: [backend-engineer, data-engineer]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22
      - id: ensense-data-replay
        kind: responsibility
        text:
          zh-TW: 建立沿用共用轉換與傳輸模組的資料回補工具，支援指定時間區間、缺漏補送與多程序批次處理，記錄 HTTPS／MQTT 傳送失敗供後續補送，並提供 CSV 備援交付。
          en: Built a replay tool reusing shared transformation and delivery modules, supporting time-window or missing-data replay and multi-process batches; recorded HTTPS/MQTT failures for subsequent replay and provided CSV fallback delivery.
        relevance_tags: [backend-engineer, data-engineer]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22
      - id: ensense-python-monitoring
        kind: responsibility
        text:
          zh-TW: 設計於 AWS EC2／Cron 執行的 Python 監控，檢查設備資料完整率與 CPU、記憶體、磁碟資源，將結果留存 Google Sheets，透過 LINE／Email 通知異常並避免同日重複寄送斷線通知。
          en: Designed Python checks running on AWS EC2 with Cron for sensor-data completeness, CPU, memory and disk usage; retained results in Google Sheets and sent LINE/email alerts while suppressing repeated disconnection emails within a day.
        relevance_tags: [cloud-platform-engineer, data-engineer]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22
      - id: ensense-ec2-delivery
        kind: responsibility
        text:
          zh-TW: 負責 Git Code Review、合併與 AWS EC2 發版，使用 Shell、SSH、systemd 手動部署及重啟服務，檢查程序、日誌與傳輸結果，必要時還原程式或設定並驗證恢復。
          en: Handled Git code review, merges and AWS EC2 releases using Shell, SSH and systemd for manual deployment and restarts; checked processes, logs and delivery results, and restored code or configuration with recovery checks when needed.
        relevance_tags: [backend-engineer, cloud-platform-engineer]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22
      - id: ensense-data-quality
        kind: responsibility
        text:
          zh-TW: 使用 Python／Pandas 分析資料缺漏、離群值與感測器偏差，統一時區及量測單位，比對小時平均值、R² 與 Bias，檢查驗收分析結果並追查時間對齊或公式問題。
          en: Used Python and Pandas to investigate missing data, outliers and sensor bias, normalize time zones and units, compare hourly averages, R-squared and Bias, and review acceptance analyses for time-alignment or formula errors.
        relevance_tags: [cloud-platform-engineer, data-engineer, data-analyst]
        verification_status: user_provided
        evidence_url: https://github.com/3pwei/wade-career-profile/blob/54e597e9a2f4105e6a6fc13940876bd33d3e6726/docs/career-review/ensense-engineering-cases.md
        last_reviewed: 2026-10-22

